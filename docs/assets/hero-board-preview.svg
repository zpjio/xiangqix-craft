      <line x1="496" y1="58" x2="496" y2="544" stroke-width="2" />
      <!-- 北岸内纵线 -->
      <line x1="118" y1="58" x2="118" y2="274" />
      <line x1="172" y1="58" x2="172" y2="274" />
      <line x1="226" y1="58" x2="226" y2="274" />
      <line x1="280" y1="58" x2="280" y2="274" />
      <line x1="334" y1="58" x2="334" y2="274" />
      <line x1="388" y1="58" x2="388" y2="274" />
      <line x1="442" y1="58" x2="442" y2="274" />
      <!-- 南岸内纵线 -->
      <line x1="118" y1="328" x2="118" y2="544" />
      <line x1="172" y1="328" x2="172" y2="544" />
      <line x1="226" y1="328" x2="226" y2="544" />
      <line x1="280" y1="328" x2="280" y2="544" />
      <line x1="334" y1="328" x2="334" y2="544" />
      <line x1="388" y1="328" x2="388" y2="544" />
      <line x1="442" y1="328" x2="442" y2="544" />
    </g>

