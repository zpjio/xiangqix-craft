        <circle r="19" fill="none" stroke="#D4AF37" stroke-width="1.2" />
        <text y="6" fill="#DFB654">士</text>
      </g>
      <!-- 黑象 (172, 58) & (388, 58) -->
      <g transform="translate(172, 58)">
