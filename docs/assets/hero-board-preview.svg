<svg viewBox="0 0 1200 720" width="1200" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景深紫檀渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1410" />
      <stop offset="50%" stop-color="#140E0B" />
      <stop offset="100%" stop-color="#0E0A08" />
    </linearGradient>

    <!-- 紫檀木棋盘外框渐变 -->
    <linearGradient id="zitanFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A241B" />
      <stop offset="50%" stop-color="#261711" />
      <stop offset="100%" stop-color="#1A0F0B" />
    </linearGradient>

    <!-- 陈年熟宣纸盘心径向渐变 -->
    <radialGradient id="xuanSurface" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#E6D2B0" />
      <stop offset="65%" stop-color="#DBC299" />
      <stop offset="100%" stop-color="#C8AA7A" />
    </radialGradient>

    <!-- 红方黄杨木棋子渐变 -->
    <radialGradient id="redToken" cx="32%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#F5E3C8" />
      <stop offset="45%" stop-color="#DFC196" />
      <stop offset="82%" stop-color="#C29B68" />
      <stop offset="100%" stop-color="#967144" />
    </radialGradient>

    <!-- 黑方乌木棋子渐变 -->
    <radialGradient id="blackToken" cx="32%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#423934" />
      <stop offset="48%" stop-color="#26201D" />
      <stop offset="85%" stop-color="#161210" />
      <stop offset="100%" stop-color="#0B0908" />
    </radialGradient>

    <!-- 棋子投影 -->
    <filter id="pieceShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0D0704" flood-opacity="0.72" />
    </filter>
  </defs>

  <!-- 整体画布底色 -->
  <rect width="1200" height="720" fill="url(#bgGrad)" rx="16" />
  <rect x="16" y="16" width="1168" height="688" fill="none" stroke="#3A281E" stroke-width="1" rx="12" />

