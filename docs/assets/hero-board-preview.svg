      <line x1="64" y1="112" x2="496" y2="112" />
      <line x1="64" y1="166" x2="496" y2="166" />
      <line x1="64" y1="220" x2="496" y2="220" />
      <line x1="64" y1="274" x2="496" y2="274" stroke-width="2" />
      <line x1="64" y1="328" x2="496" y2="328" stroke-width="2" />
      <line x1="64" y1="382" x2="496" y2="382" />
      <line x1="64" y1="436" x2="496" y2="436" />
      <line x1="64" y1="490" x2="496" y2="490" />
      <line x1="64" y1="544" x2="496" y2="544" stroke-width="2" />
    </g>

