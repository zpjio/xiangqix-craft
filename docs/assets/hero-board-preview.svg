        <circle r="19" fill="none" stroke="#9E2A2B" stroke-width="1.3" />
        <circle r="16.5" fill="none" stroke="#9E2A2B" stroke-width="0.8" stroke-dasharray="3 2" />
        <text y="6" fill="#A62222">帥</text>
      </g>
      <!-- 红仕 (226, 544) & (334, 544) -->
      <g transform="translate(226, 544)">
        <circle r="22" fill="url(#redToken)" />
        <circle r="19" fill="none" stroke="#9E2A2B" stroke-width="1.3" />
        <text y="6" fill="#A62222">仕</text>
      </g>
      <g transform="translate(334, 544)">
