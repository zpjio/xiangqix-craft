        <circle r="19" fill="none" stroke="#D4AF37" stroke-width="1.2" />
        <text y="6" fill="#DFB654">馬</text>
      </g>
      <g transform="translate(388, 166)">
        <circle r="22" fill="url(#blackToken)" />
        <circle r="19" fill="none" stroke="#D4AF37" stroke-width="1.2" />
        <text y="6" fill="#DFB654">馬</text>
      </g>
      <!-- 黑車 (118, 58) & (496, 58) -->
      <g transform="translate(118, 58)">
        <circle r="22" fill="url(#blackToken)" />
        <circle r="19" fill="none" stroke="#D4AF37" stroke-width="1.2" />
        <text y="6" fill="#DFB654">車</text>
      </g>
      <g transform="translate(496, 58)">
        <circle r="22" fill="url(#blackToken)" />
        <circle r="19" fill="none" stroke="#D4AF37" stroke-width="1.2" />
        <text y="6" fill="#DFB654">車</text>
      </g>
      <!-- 黑砲 (118, 166) & (442, 166) -->
      <g transform="translate(118, 166)">
        <circle r="22" fill="url(#blackToken)" />
        <circle r="19" fill="none" stroke="#D4AF37" stroke-width="1.2" />
        <text y="6" fill="#DFB654">砲</text>
      </g>
      <g transform="translate(442, 166)">
        <circle r="22" fill="url(#blackToken)" />
        <circle r="19" fill="none" stroke="#D4AF37" stroke-width="1.2" />
        <text y="6" fill="#DFB654">砲</text>
      </g>

      <!-- 红方当头炮与底线阵列 -->
      <!-- 红中炮 (280, 436) 带朱砂落子气浪环与散落微尘 -->
      <g transform="translate(280, 436)">
        <circle r="28" fill="none" stroke="#C8372D" stroke-width="1.5" stroke-dasharray="3 3" />
        <circle cx="-26" cy="-14" r="2.2" fill="#C8372D" />
        <circle cx="28" cy="-10" r="1.8" fill="#DFC196" />
        <circle cx="22" cy="20" r="2" fill="#C8372D" />
        <circle cx="-22" cy="18" r="1.6" fill="#8C5A36" />
        <circle r="22" fill="url(#redToken)" />
        <circle r="19" fill="none" stroke="#9E2A2B" stroke-width="1.3" />
        <circle r="16.5" fill="none" stroke="#9E2A2B" stroke-width="0.7" />
        <text y="6" fill="#A62222">炮</text>
