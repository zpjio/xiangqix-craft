    <!-- 外粗内细重框 -->
    <rect x="57" y="51" width="446" height="500" fill="none" stroke="#2B221C" stroke-width="3" stroke-opacity="0.9" />
    <rect x="64" y="58" width="432" height="486" fill="none" stroke="#2B221C" stroke-width="1.5" />

