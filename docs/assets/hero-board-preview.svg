    <rect x="0" y="0" width="560" height="648" rx="12" fill="url(#zitanFrame)" stroke="#583B2B" stroke-width="2" />
    <!-- 四角黄铜回纹包角 -->
    <path d="M 8 24 L 8 8 L 24 8" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.65" />
    <path d="M 536 8 L 552 8 L 552 24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.65" />
    <path d="M 8 624 L 8 640 L 24 640" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.65" />
    <path d="M 536 640 L 552 640 L 552 624" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.65" />

