  <!-- ==================== 右侧：象棋考工 (XiangqiX UI) 视觉与架构图解 ==================== -->
  <g transform="translate(656, 52)" font-family="'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif">
    <text x="0" y="20" fill="#D4AF37" font-size="13" font-weight="bold" letter-spacing="3">
      XIANGQIX ECOSYSTEM · OFFICIAL VISUAL ENGINE
    </text>
    <text x="0" y="64" fill="#F4EFE6" font-size="34" font-weight="bold" letter-spacing="1.5">
      象棋考工 · XiangqiX Craft UI
    </text>
    <text x="0" y="98" fill="#B8A692" font-size="15">
      基于 SVG + DOM + CSS 混合渲染架构的中国象棋东方造物设计系统
    </text>

    <line x1="0" y1="122" x2="480" y2="122" stroke="#3A281E" stroke-width="1" />

    <!-- 核心规范卡片 1 -->
    <g transform="translate(0, 144)">
      <rect width="484" height="104" rx="10" fill="#1F1612" stroke="#3E2B20" stroke-width="1" />
      <text x="22" y="34" fill="#D4AF37" font-size="16" font-weight="bold">01. 九路十线 · 楚河汉界矢量案几 (SVG Layer)</text>
      <text x="22" y="62" fill="#C2B09C" font-size="13">外粗内细双层重框、南北九宫米字斜线、14 处炮/兵卒直角折角花标</text>
      <text x="22" y="84" fill="#9C8976" font-size="12">支持「熟宣紫檀」「宫廷大漆」「宋韵汝窑」三套东方传统器物材质切换</text>
    </g>

    <!-- 核心规范卡片 2 -->
    <g transform="translate(0, 266)">
      <rect width="484" height="104" rx="10" fill="#1F1612" stroke="#3E2B20" stroke-width="1" />
      <text x="22" y="34" fill="#E25B4B" font-size="16" font-weight="bold">02. 红黑阵营色彩与几何双重微差 (Hybrid Token)</text>
      <text x="22" y="62" fill="#C2B09C" font-size="13">红方：温润黄杨木胎 + 辰州朱砂阴刻 + 双同心圆环与四极海棠菱花</text>
      <text x="22" y="84" fill="#C2B09C" font-size="13">黑方：沉穆乌木胎体 + 宫廷赤金描金 + 外圆内正八边形玄甲虎符框</text>
    </g>

    <!-- 核心规范卡片 3 -->
    <g transform="translate(0, 388)">
      <rect width="484" height="104" rx="10" fill="#1F1612" stroke="#3E2B20" stroke-width="1" />
      <text x="22" y="34" fill="#D4AF37" font-size="16" font-weight="bold">03. 朱砂微尘散落与空间木纹声学 (Physics &amp; Audio)</text>
      <text x="22" y="62" fill="#C2B09C" font-size="13">CSS 合成器驱动落子瞬间朱砂粉尘与细木屑径向抛射、吃子双环气浪</text>
      <text x="22" y="84" fill="#9C8976" font-size="12">Web Audio 实时计算盘心空腔浑厚共鸣 (175Hz) 与紫檀边廓清脆刚音 (275Hz)</text>
    </g>

    <!-- 底部东方传统色卡展示 -->
    <g transform="translate(0, 518)">
      <text x="0" y="18" fill="#C8A252" font-size="12" font-weight="bold" letter-spacing="2">
        TRADITIONAL CHINESE MINERAL &amp; WOOD PALETTE · 东方传统色系
      </text>
      <g transform="translate(0, 32)">
        <rect x="0"   y="0" width="72" height="54" rx="6" fill="#A62626" stroke="#ffffff22" />
        <text x="36"  y="72" text-anchor="middle" fill="#C2B09C" font-size="11">辰州朱砂</text>

        <rect x="82"  y="0" width="72" height="54" rx="6" fill="#D4AF37" stroke="#ffffff22" />
        <text x="118" y="72" text-anchor="middle" fill="#C2B09C" font-size="11">赤金泥金</text>

        <rect x="164" y="0" width="72" height="54" rx="6" fill="#DFC196" stroke="#ffffff22" />
        <text x="200" y="72" text-anchor="middle" fill="#C2B09C" font-size="11">温润黄杨</text>

        <rect x="246" y="0" width="72" height="54" rx="6" fill="#DFC8A2" stroke="#ffffff22" />
        <text x="282" y="72" text-anchor="middle" fill="#C2B09C" font-size="11">陈年熟宣</text>

        <rect x="328" y="0" width="72" height="54" rx="6" fill="#2C1E18" stroke="#ffffff33" />
        <text x="364" y="72" text-anchor="middle" fill="#C2B09C" font-size="11">小叶紫檀</text>

        <rect x="410" y="0" width="72" height="54" rx="6" fill="#3E6B52" stroke="#ffffff22" />
        <text x="446" y="72" text-anchor="middle" fill="#C2B09C" font-size="11">青白玉色</text>
      </g>
    </g>
