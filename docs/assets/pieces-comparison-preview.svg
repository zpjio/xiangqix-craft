<svg viewBox="0 0 1200 420" width="1200" height="420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="atlasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D1511" />
      <stop offset="100%" stop-color="#120D0A" />
    </linearGradient>

    <radialGradient id="redWood" cx="32%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#F5E3C8" />
      <stop offset="45%" stop-color="#DFC196" />
      <stop offset="82%" stop-color="#C29B68" />
      <stop offset="100%" stop-color="#967144" />
    </radialGradient>

    <radialGradient id="blackWood" cx="32%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#423934" />
      <stop offset="48%" stop-color="#26201D" />
      <stop offset="85%" stop-color="#161210" />
      <stop offset="100%" stop-color="#0B0908" />
    </radialGradient>

    <filter id="tokenDrop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#090503" flood-opacity="0.78" />
    </filter>
  </defs>

  <rect width="1200" height="420" rx="14" fill="url(#atlasBg)" />
  <rect x="14" y="14" width="1172" height="392" rx="10" fill="none" stroke="#3A281E" stroke-width="1" />

  <!-- 标题 -->
  <g transform="translate(48, 46)" font-family="'Noto Serif SC', 'PingFang SC', serif">
    <text x="0" y="0" fill="#D4AF37" font-size="12" font-weight="bold" letter-spacing="2">
      14-PIECE CALLIGRAPHY &amp; SILHOUETTE ATLAS · 十四枚红黑棋子造型微差图鉴
    </text>
    <text x="0" y="30" fill="#F4EFE6" font-size="22" font-weight="bold">
      红方「双圆连珠 · 四极海棠菱花」 vs 黑方「外圆内八角 · 玄甲虎符矩纹」
    </text>
  </g>

  <!-- 第一排：红方七兵种 (帥 仕 相 俥 傌 炮 兵) -->
  <g transform="translate(115, 162)" filter="url(#tokenDrop)" font-family="'Noto Serif SC', 'Kaiti SC', serif" font-weight="900" font-size="34" text-anchor="middle">
    <!-- 1. 帥 -->
    <g transform="translate(0, 0)">
      <circle r="48" fill="url(#redWood)" />
      <circle r="41" fill="none" stroke="#9E2A2B" stroke-width="2.2" />
      <circle r="36" fill="none" stroke="#9E2A2B" stroke-width="1.1" stroke-dasharray="5 2.5" />
      <polygon points="0,-44 2,-41 0,-38 -2,-41" fill="#9E2A2B" />
      <polygon points="0,38 2,41 0,44 -2,41" fill="#9E2A2B" />
      <polygon points="-44,0 -41,-2 -38,0 -41,2" fill="#9E2A2B" />
      <polygon points="38,0 41,-2 44,0 41,2" fill="#9E2A2B" />
      <text y="12" fill="#A62222">帥</text>
    </g>
    <!-- 2. 仕 -->
    <g transform="translate(160, 0)">
      <circle r="48" fill="url(#redWood)" />
      <circle r="41" fill="none" stroke="#9E2A2B" stroke-width="2.2" />
      <circle r="36" fill="none" stroke="#9E2A2B" stroke-width="1" />
      <text y="12" fill="#A62222">仕</text>
    </g>
    <!-- 3. 相 -->
    <g transform="translate(320, 0)">
      <circle r="48" fill="url(#redWood)" />
      <circle r="41" fill="none" stroke="#9E2A2B" stroke-width="2.2" />
      <circle r="36" fill="none" stroke="#9E2A2B" stroke-width="1" />
      <text y="12" fill="#A62222">相</text>
    </g>
    <!-- 4. 俥 -->
    <g transform="translate(480, 0)">
      <circle r="48" fill="url(#redWood)" />
      <circle r="41" fill="none" stroke="#9E2A2B" stroke-width="2.2" />
      <circle r="36" fill="none" stroke="#9E2A2B" stroke-width="1" />
      <text y="12" fill="#A62222">俥</text>
    </g>
    <!-- 5. 傌 -->
    <g transform="translate(640, 0)">
      <circle r="48" fill="url(#redWood)" />
      <circle r="41" fill="none" stroke="#9E2A2B" stroke-width="2.2" />
      <circle r="36" fill="none" stroke="#9E2A2B" stroke-width="1" />
      <text y="12" fill="#A62222">傌</text>
    </g>
    <!-- 6. 炮 -->
    <g transform="translate(800, 0)">
      <circle r="48" fill="url(#redWood)" />
      <circle r="41" fill="none" stroke="#9E2A2B" stroke-width="2.2" />
      <circle r="36" fill="none" stroke="#9E2A2B" stroke-width="1" />
      <text y="12" fill="#A62222">炮</text>
    </g>
    <!-- 7. 兵 -->
    <g transform="translate(960, 0)">
      <circle r="48" fill="url(#redWood)" />
      <circle r="41" fill="none" stroke="#9E2A2B" stroke-width="2.2" />
      <circle r="36" fill="none" stroke="#9E2A2B" stroke-width="1" />
      <text y="12" fill="#A62222">兵</text>
    </g>
  </g>

  <!-- 第二排：黑方七兵种 (將 士 象 車 馬 砲 卒) -->
  <g transform="translate(115, 310)" filter="url(#tokenDrop)" font-family="'Noto Serif SC', 'Kaiti SC', serif" font-weight="900" font-size="34" text-anchor="middle">
    <!-- 1. 將 -->
    <g transform="translate(0, 0)">
      <circle r="48" fill="url(#blackWood)" />
      <circle r="41" fill="none" stroke="#D4AF37" stroke-width="2.2" />
      <polygon points="0,-36 25,-25 36,0 25,25 0,36 -25,25 -36,0 -25,-25" fill="none" stroke="#D4AF37" stroke-width="1.2" />
      <text y="12" fill="#DFB654">將</text>
    </g>
    <!-- 2. 士 -->
    <g transform="translate(160, 0)">
      <circle r="48" fill="url(#blackWood)" />
      <circle r="41" fill="none" stroke="#D4AF37" stroke-width="2.2" />
      <polygon points="0,-36 25,-25 36,0 25,25 0,36 -25,25 -36,0 -25,-25" fill="none" stroke="#D4AF37" stroke-width="1.1" />
      <text y="12" fill="#DFB654">士</text>
    </g>
    <!-- 3. 象 -->
    <g transform="translate(320, 0)">
      <circle r="48" fill="url(#blackWood)" />
      <circle r="41" fill="none" stroke="#D4AF37" stroke-width="2.2" />
      <polygon points="0,-36 25,-25 36,0 25,25 0,36 -25,25 -36,0 -25,-25" fill="none" stroke="#D4AF37" stroke-width="1.1" />
      <text y="12" fill="#DFB654">象</text>
    </g>
    <!-- 4. 車 -->
    <g transform="translate(480, 0)">
      <circle r="48" fill="url(#blackWood)" />
      <circle r="41" fill="none" stroke="#D4AF37" stroke-width="2.2" />
      <polygon points="0,-36 25,-25 36,0 25,25 0,36 -25,25 -36,0 -25,-25" fill="none" stroke="#D4AF37" stroke-width="1.1" />
      <text y="12" fill="#DFB654">車</text>
    </g>
    <!-- 5. 馬 -->
    <g transform="translate(640, 0)">
      <circle r="48" fill="url(#blackWood)" />
      <circle r="41" fill="none" stroke="#D4AF37" stroke-width="2.2" />
      <polygon points="0,-36 25,-25 36,0 25,25 0,36 -25,25 -36,0 -25,-25" fill="none" stroke="#D4AF37" stroke-width="1.1" />
      <text y="12" fill="#DFB654">馬</text>
    </g>
    <!-- 6. 砲 -->
    <g transform="translate(800, 0)">
      <circle r="48" fill="url(#blackWood)" />
      <circle r="41" fill="none" stroke="#D4AF37" stroke-width="2.2" />
      <polygon points="0,-36 25,-25 36,0 25,25 0,36 -25,25 -36,0 -25,-25" fill="none" stroke="#D4AF37" stroke-width="1.1" />
      <text y="12" fill="#DFB654">砲</text>
    </g>
    <!-- 7. 卒 -->
    <g transform="translate(960, 0)">
      <circle r="48" fill="url(#blackWood)" />
      <circle r="41" fill="none" stroke="#D4AF37" stroke-width="2.2" />
      <polygon points="0,-36 25,-25 36,0 25,25 0,36 -25,25 -36,0 -25,-25" fill="none" stroke="#D4AF37" stroke-width="1.1" />
      <text y="12" fill="#DFB654">卒</text>
    </g>
  </g>
</svg>
